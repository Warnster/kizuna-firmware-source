dependencies:
  # ESP-IDF v6.1 renamed/generalized the old in-tree "wifi_provisioning" component to
  # "network_provisioning" (now covers Wi-Fi + Thread under one API) -- see ota_update.c for the
  # resulting API differences (network_prov_mgr_* instead of wifi_prov_mgr_*).
  espressif/network_provisioning: "*"
  # ota_update.c calls cJSON directly, so declare it here. It used to arrive only as a private
  # transitive dependency of an older network_provisioning; a fresh dependency solve (CI has no
  # committed dependencies.lock) picks network_provisioning 1.3.0, which dropped it.
  espressif/cjson: "^1.7.19"
  idf:
    version: ">=5.0"
