CONFIG_GPIO=y
CONFIG_DMA=y
CONFIG_COUNTER=y
CONFIG_EVENTS=y

CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_BOS=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_CDC_ACM=y
# Composite (vendor + CDC) needs more concurrent transfers than the defaults.
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_USB_NUMOF_EP_WRITE_RETRIES=10
CONFIG_SERIAL=y
# Kizuna: product name and WebUSB landing page are ours; VID 0x2FE3 / PID 0x000A stay stock so
# GB-Link's web apps (launcher, gb-pokemon-web, Celio-Client) still recognise the adapter.
CONFIG_USB_DEVICE_PRODUCT="Kizuna"
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_TICKLESS_KERNEL=y

CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y

CONFIG_PINCTRL=y

# Flash storage for persistent settings (the WebUSB landing-page toggle).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_SECTIONS_USE_MASTER_MODE=y
CONFIG_REBOOT=y
# Driving SD low is opt-in (off by default). For rare compatibility issues with some GBAs.
# Kizuna: back to stock (off). The 2026-10-03 bring-up showed the multiboot failure was SI
# low at GBA power-up, not SD; the proven single-chip host leaves SD floating. Untested with
# a 6-wire cable that carries SD, so leave this off until that case is measured.
CONFIG_GB_LINK_DRIVE_SD_LOW=n
# Kizuna: 4-wire GBC cable, SD never reaches the adapter; the floating pins read as soft resets.
CONFIG_GB_LINK_RFU_IGNORE_SD=y

# Lets zephyr_code_relocate() place the wireless adapter's transfer path in RAM.
CONFIG_CODE_DATA_RELOCATION=y
